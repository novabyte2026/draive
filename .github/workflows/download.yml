name: Test Forms to Drive integration
run-name: Download integration · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Request UUID from the Apps Script request sheet
        required: true
        type: string

permissions:
  contents: read

# One group per request: different requests do not cancel each other's queue.
concurrency:
  group: draive-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install media dependencies
        id: dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade -r requirements.txt
      - name: Process request without account cookies
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python -m worker.main
      - name: Report setup failure
        if: failure() && steps.dependencies.outcome != 'success'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python -m worker.main --fail-setup
